name: TownySubscriptionsBridge
version: ${project.version}
main: net.townysmp.subscriptions.TownySubscriptionsBridge
api-version: '26.2'
authors: [TownyReborn]
description: Enforces TownyReborn subscription home, vault and QuickShop expiry limits.
depend: [QuickShop-Hikari, LuckPerms]
softdepend: [Essentials, AxVaults]
permissions:
  townysmp.subscriptions.bypass:
    description: Bypasses home, vault and over-limit shop restrictions.
    default: op
  townysmp.subscriptions.shops.extra.5:
    description: Adds five permanent shop slots to the current rank, up to 50.
    default: false
